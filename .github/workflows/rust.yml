name: PTPAI Cross-Platform CI (macOS & Ubuntu)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Run Cargo Tests
        run: cargo test --verbose

      - name: Build Optimized Release Binary
        run: cargo build --release --verbose

      - name: Prepare Binary Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          cp target/release/ptpai artifacts/ptpai-macos-arm64
          chmod +x artifacts/ptpai-macos-arm64

      - name: Prepare Binary Artifacts (Ubuntu Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp target/release/ptpai artifacts/ptpai-ubuntu-x86_64
          chmod +x artifacts/ptpai-ubuntu-x86_64

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptpai-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error
